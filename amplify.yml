version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - cd apps/client
        - npm install
    build:
      commands:
        - npm run build:web
    postBuild:
      commands:
        - echo "Build completed successfully"
  artifacts:
    baseDirectory: apps/client/dist
    files:
      - '**/*'
  cache:
    paths:
      - apps/client/node_modules/**/*
      - node_modules/**/*

