version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - cd apps/client && npm install
        - cd ../..
    build:
      commands:
        - cd apps/client
        - 'npm run build:web'
        - cd ../..
    postBuild:
      commands:
        - echo "Build completed"
  artifacts:
    baseDirectory: apps/client/dist
    files:
      - '**/*'
  cache:
    paths:
      - apps/client/node_modules/**/*
      - node_modules/**/*
